[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterprise-interview-backend"
version = "1.0.0"
description = "Enterprise AI-Powered Mock Interview & Semantic ATS Analyzer - Backend"
requires-python = ">=3.12"
dependencies = [
    # Web Framework
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.12",
    "websockets==13.1",

    # Database
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pgvector==0.3.6",

    # Caching
    "redis[hiredis]==5.2.1",
    "aiocache==0.12.3",

    # Pydantic & Validation
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "email-validator==2.2.0",

    # Auth & Security
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",

    # AI / LLM
    "openai==1.57.4",
    "langgraph==0.2.59",
    "langchain==0.3.12",
    "langchain-openai==0.2.12",

    # Audio Processing
    "librosa==0.10.2.post1",
    "scipy==1.14.1",
    "numpy==2.1.3",
    "soundfile==0.12.1",

    # PDF Parsing
    "pypdf==5.1.0",

    # Object Storage
    "boto3==1.35.83",
    "aioboto3==13.2.0",

    # HTTP Client
    "httpx==0.28.1",
    "aiofiles==24.1.0",

    # Observability
    "opentelemetry-api==1.29.0",
    "opentelemetry-sdk==1.29.0",
    "opentelemetry-instrumentation-fastapi==0.50b0",
    "structlog==24.4.0",

    # Utilities
    "python-dotenv==1.0.1",
    "orjson==3.10.12",
    "tenacity==9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "ruff==0.8.4",
    "mypy==1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
